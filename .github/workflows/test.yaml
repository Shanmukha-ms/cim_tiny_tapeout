name: test

on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install -r test/requirements.txt
          echo "cocotb version: $(cocotb-config --version)"
          echo "cocotb makefiles: $(cocotb-config --makefiles)"

      - name: Run tests
        run: |
          cd test
          make clean
          make SIM=icarus
          if [ ! -f results.xml ]; then
            echo "results.xml not found — simulation did not produce output"
            exit 1
          fi
          if grep -q "failure" results.xml; then
            echo "Test failures detected in results.xml"
            exit 1
          fi
          echo "All tests passed"

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload waveform and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            test/tb.fst
            test/results.xml
